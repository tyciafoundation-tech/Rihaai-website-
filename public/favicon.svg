<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Warm background circle -->
  <circle cx="32" cy="32" r="30" fill="#FAF9F5" stroke="#E8E4DA" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="#181715" />
  
  <!-- Stylized Scales of Justice + Bird of Freedom in Terracotta -->
  <!-- Central pillar -->
  <line x1="32" y1="18" x2="32" y2="44" stroke="#FAF9F5" stroke-width="2" stroke-linecap="round"/>
  <!-- Top beam -->
  <line x1="20" y1="24" x2="44" y2="24" stroke="#FAF9F5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="18" r="2" fill="#B85042"/>
  
  <!-- Left pan (descending) -->
  <path d="M20 24 L16 33 M20 24 L24 33" stroke="#ABA496" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M14 33 Q20 37 26 33" stroke="#FAF9F5" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Right pan (rising toward freedom) -->
  <path d="M44 24 L40 31 M44 24 L48 31" stroke="#ABA496" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M38 31 Q44 35 50 31" stroke="#FAF9F5" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Bird of Freedom soaring out of the scale in Terracotta -->
  <path d="M33 16 C35 13, 38 12, 42 13 C39 15, 38 17, 36 18 C39 19, 43 20, 45 22 C41 21, 37 20, 34 20 Z" fill="#B85042"/>
  
  <!-- Base -->
  <path d="M26 44 L38 44" stroke="#FAF9F5" stroke-width="2.5" stroke-linecap="round"/>
</svg>
